<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos Personales - Nuestro Termómetro Económico</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
/* ─── VARIABLES TEMA SAAS FINTECH ─── */
:root {
  --bg: #090D16;
  --sidebar-bg: #0F172A;
  --card: #111827;
  --card-hover: #1E293B;
  --input: #162032;
  --soft: #1E293B;
  --softer: #172033;
  --divider: rgba(255, 255, 255, 0.07);
  --border: rgba(255, 255, 255, 0.09);
  
  --t-fff: #FFFFFF;
  --t-e8: #F3F4F6;
  --t-ccc: #D1D5DB;
  --t-aaa: #9CA3AF;
  --t-888: #6B7280;
  --t-555: #4B5563;
  
  --accent-blue: #3B82F6;
  --accent-green: #10B981;
  --accent-red: #EF4444;
  --accent-amber: #F59E0B;
  --accent-purple: #8B5CF6;
  --accent-pink: #EC4899;
  
  --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
}

body.light {
  --bg: #F8FAFC;
  --sidebar-bg: #FFFFFF;
  --card: #FFFFFF;
  --card-hover: #F1F5F9;
  --input: #F8FAFC;
  --soft: #F1F5F9;
  --softer: #F8FAFC;
  --divider: #E2E8F0;
  --border: #E2E8F0;
  
  --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--t-e8);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.app-container { display: flex; min-height: 100vh; }
.mobile-header { display: none; }
.sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.6); z-index: 90; }
.sidebar-overlay.open { display: block; }

.sidebar {
  width: 270px; background: var(--sidebar-bg); border-right: 1px solid var(--border);
  padding: 1.75rem 1.25rem; display: flex; flex-direction: column; justify-content: space-between;
  position: sticky; top: 0; height: 100vh; flex-shrink: 0; z-index: 100; transition: transform 0.3s ease;
}

.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 2rem; }
.brand-icon {
  width: 42px; height: 42px; border-radius: 12px;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  display: flex; align-items: center; justify-content: center; font-size: 22px;
}
.brand-text h2 { font-size: 16px; font-weight: 700; color: var(--t-fff); }
.brand-text p { font-size: 11px; color: var(--t-aaa); }

.nav-menu { display: flex; flex-direction: column; gap: 6px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 11px 14px; font-size: 13px; font-weight: 500;
  color: var(--t-aaa); border-radius: 10px; cursor: pointer; border: none; background: transparent; width: 100%; text-align: left;
}
.nav-item:hover { color: var(--t-fff); background: var(--soft); }
.nav-item.active { color: var(--t-fff); background: var(--accent-blue); font-weight: 600; }
.main-wrapper { flex: 1; padding: 2rem 2.5rem; overflow-y: auto; width: 100%; }
.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem; }
.metric, .summary-strip, .chart-card, .table-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.25rem 1.5rem; box-shadow: var(--shadow);
}
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.metric-label { font-size: 11px; font-weight: 600; color: var(--t-aaa); text-transform: uppercase; margin-bottom: 6px; }
.metric-value { font-size: 22px; font-weight: 700; color: var(--t-fff); }
.loading { text-align: center; padding: 4rem 0; color: var(--t-aaa); font-size: 15px; }
.error-msg { background: rgba(239, 68, 68, 0.1); color: #FCA5A5; border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 12px; padding: 14px 18px; margin-bottom: 1rem; }
</style>
</head>
<body>

<div class="app-container">
  <aside class="sidebar" id="sidebar">
    <div>
      <div class="brand">
        <div class="brand-icon">🏡</div>
        <div class="brand-text">
          <h2>Gastos Personales</h2>
          <p>Termómetro Seguro</p>
        </div>
      </div>
      <nav class="nav-menu">
        <button class="nav-item active" onclick="setTab('mes', this)"><span>📊</span> Este ciclo</button>
      </nav>
    </div>
  </aside>

  <main class="main-wrapper">
    <div class="top-bar">
      <div>
        <h1 id="tabTitleHeader" style="color:var(--t-fff); font-size:22px;">Resumen del Ciclo</h1>
        <p style="color:var(--t-aaa); font-size:13px;">Panel seguro conectado a datos locales</p>
      </div>
    </div>

    <div id="errorBox" style="display:none;" class="error-msg"></div>
    <div id="loadingBox" class="loading">Cargando datos de forma segura desde datos.json...</div>

    <div id="tabMes">
      <div class="metrics" id="metricsBox"></div>
      <div class="table-card">
        <p style="font-size:12px; font-weight:700; color:var(--t-aaa); margin-bottom:14px; text-transform:uppercase;">Transacciones Recientes</p>
        <div id="tablaContenido" style="color:var(--t-ccc);">Cargando transacciones...</div>
      </div>
    </div>
  </main>
</div>

<script>
// URL SEGURA: Apunta a tu archivo local en lugar de exponer Google Sheets
const DATOS_URL = './datos.json';

let tabActivo = 'mes';

function setTab(tab, el) {
  document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

function loadData() {
  document.getElementById('loadingBox').style.display='block';
  document.getElementById('errorBox').style.display='none';

  fetch(DATOS_URL)
    .then(response => {
      if (!response.ok) throw new Error("No se pudo encontrar o cargar el archivo datos.json");
      return response.json();
    })
    .then(data => {
      document.getElementById('loadingBox').style.display='none';
      renderDashboard(data);
    })
    .catch(err => {
      console.error('Error cargando datos:', err);
      document.getElementById('loadingBox').style.display='none';
      document.getElementById('errorBox').innerHTML = 'Error al cargar datos.json. Asegurate de que el archivo esté creado en la raíz de tu repositorio.';
      document.getElementById('errorBox').style.display='block';
    });
}

function renderDashboard(data) {
  // Renderizado básico de prueba con el JSON local
  const transacciones = data.transacciones || [];
  
  document.getElementById('metricsBox').innerHTML = `
    <div class="metric">
      <p class="metric-label">Estado del Sistema</p>
      <p class="metric-value" style="color:var(--accent-green);">Protegido y Seguro</p>
    </div>
    <div class="metric">
      <p class="metric-label">Última Actualización</p>
      <p class="metric-value" style="font-size:18px;">${data.actualizado || 'Reciente'}</p>
    </div>
  `;

  if(transacciones.length === 0) {
    document.getElementById('tablaContenido').innerHTML = '<p style="color:var(--t-aaa); font-size:13px;">El archivo datos.json está conectado correctamente pero aún no tiene transacciones registradas.</p>';
  } else {
    document.getElementById('tablaContenido').innerHTML = `<p>Se cargaron ${transacciones.length} registros correctamente.</p>`;
  }
}

// Iniciar carga al abrir
loadData();
</script>
</body>
</html>
